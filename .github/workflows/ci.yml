name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows only (the user's decision, 2026-11-04): the project is built and run
# with MSVC on Windows. The Linux GCC/Clang/sanitizer/fuzz jobs were removed;
# see git history (e0a4c7a) to restore them. The authoritative gate is the
# full build + ctest on the user's AVX-512 server; this job is a second check.
jobs:
  windows:
    name: msvc-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Runner CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List

      # Exactly the commands in docs/WINDOWS.md.
      - name: "Configure (preset windows-msvc - Visual Studio 2022, x64, AVX2)"
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-release --parallel 4

      - name: Test
        run: ctest --preset windows-release

      # The runner's CPU (Zen 3) has no AVX-512: compile the AVX-512 preset
      # so MSVC accepts those kernels; they run on AVX-512 PCs (the user's server runs the full suite).
      - name: Build the AVX-512 preset (compile only)
        run: |
          cmake --preset windows-msvc-avx512
          cmake --build --preset windows-avx512-release --parallel 4 --target rag_tests rag_latency train_ensemble

      - name: Demos and latency smoke run
        shell: bash
        run: |
          ./build/Release/rag_demo.exe
          ./build/Release/agent_demo.exe | tail -n 25
          ./build/Release/rag_latency.exe
